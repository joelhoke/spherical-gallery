<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spherical Gallery · Placeholder preview</title>
  <link rel="stylesheet" href="../packages/spherical-gallery/dist/styles.css" />
  <link rel="stylesheet" href="../packages/mesh-backgrounds/dist/styles.css" />
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #edf0ee;
      color: #20322f;
      font-family: system-ui, sans-serif;
    }
    #gallery {
      --sg-height: 100dvh;
      --sg-background: #edf0ee;
      --sg-font: ui-monospace, monospace;
      --sg-display-font: system-ui;
    }
  </style>
  <main id="gallery" aria-label="Gallery of generated placeholders"></main>
  <script type="module">
    import { createGallery } from '../packages/spherical-gallery/dist/browser.js'
    import { meshPlaceholder } from '../packages/mesh-backgrounds/dist/gallery.js'
    const ascii = meshPlaceholder({ renderer: 'ascii', motion: false, interactive: false })
    const pixels = meshPlaceholder({ renderer: 'pixels', motion: false, interactive: false })
    window.previewGallery = createGallery(document.querySelector('#gallery'), {
      items: [],
      title: 'Spherical Gallery',
      sizing: 'viewport',
      theme: 'light',
      renderPlaceholder: (context) => (context.artwork.palette % 2 ? ascii : pixels)(context),
      placeholderLabel: ({ seed }) => ({
        title: `Study ${String(seed).slice(-4)}`,
        category: 'Generated placeholder',
      }),
    })
  </script>
</html>
